server:
  port: 8080

spring:
  application:
    name: trino-api
  task:
    scheduling:
      # Default is ONE thread for every @Scheduled bean. HubSse.battementCoeur
      # writes synchronously to every emitter, and DetecteurSilence holds a
      # transaction while it sweeps -- on a single thread one stalled SSE
      # consumer would block the degradation safety net that decision 8 rests
      # on, silently, while pinning a DB connection.
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/trino
    username: trino
    password: trino
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

trino:
  cors:
    # Comma-separated list -- a list, not a single string, because phase 7's
    # docker-compose needs to allow more than one frontend origin at once.
    origines: ${TRINO_CORS_ORIGINES:http://localhost:3000}
  jwt:
    secret: ${TRINO_JWT_SECRET:changeme-dev-secret-not-for-production-use-only-32bytes-min}
    access-expiration-minutes: 30
    refresh-expiration-days: 7
  ingestion:
    # Shared secret the position feed presents in X-Ingest-Key. The simulator
    # is one holder of it today; real AVL hardware would be another.
    cle: ${TRINO_INGEST_KEY:dev-key}
