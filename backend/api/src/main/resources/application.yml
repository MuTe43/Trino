server:
  port: 8080

spring:
  application:
    name: trino-api
  task:
    scheduling:
      # Default is ONE thread for every @Scheduled bean. HubSse.battementCoeur
      # writes synchronously to every emitter, and DetecteurSilence holds a
      # transaction while it sweeps -- on a single thread one stalled SSE
      # consumer would block the degradation safety net that decision 8 rests
      # on, silently, while pinning a DB connection.
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/trino
    username: trino
    password: trino
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Mailpit, from docker-compose. No username, no password, no TLS: it exists
    # to be looked at, not to be secured.
    host: ${TRINO_SMTP_HOST:localhost}
    port: ${TRINO_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Bounded on purpose. Dispatch already runs off the ingestion thread,
          # so a dead mail server cannot slow the delay engine -- but with no
          # timeout it would hold a dispatcher thread until the OS gave up, and
          # four such threads is the whole pool. Five seconds turns "SMTP is
          # down" into an ECHEC row with a cause, quickly.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Boot auto-enables the liveness/readiness split only on Kubernetes, so
      # without this /actuator/health/readiness is a 404 -- which is what
      # decision 8 was claiming to have. Turning it on costs two indicators and
      # gives the aggregate a meaning it did not have: /actuator/health answers
      # UP as soon as Tomcat is listening, whereas readiness stays
      # OUT_OF_SERVICE until ApplicationReadyEvent, i.e. until Flyway has
      # migrated and the context is fully refreshed.
      #
      # Readiness is NOT proof that the day has been materialised. The
      # ACCEPTING_TRAFFIC transition and GenerateurCourses both hang off
      # ApplicationReadyEvent and their order is unspecified, so a probe that
      # needs today's courses must still assert on the courses themselves --
      # which is exactly what scripts/demo.sh does, and why.
      probes:
        enabled: true

trino:
  cors:
    # Comma-separated list -- a list, not a single string, because phase 7's
    # docker-compose needs to allow more than one frontend origin at once.
    origines: ${TRINO_CORS_ORIGINES:http://localhost:3000}
  jwt:
    secret: ${TRINO_JWT_SECRET:changeme-dev-secret-not-for-production-use-only-32bytes-min}
    access-expiration-minutes: 30
    refresh-expiration-days: 7
  ingestion:
    # Shared secret the position feed presents in X-Ingest-Key. The simulator
    # is one holder of it today; real AVL hardware would be another.
    cle: ${TRINO_INGEST_KEY:dev-key}
  notification:
    # From: address on every notification email. A no-reply on the SNCFT domain
    # because nothing reads replies -- there is no inbound mail path, and an
    # address that looks answerable is a promise the system does not keep.
    email-expediteur: ${TRINO_EMAIL_EXPEDITEUR:no-reply@sncft.tn}
