server:
  port: 8080

spring:
  application:
    name: trino-api
  datasource:
    url: jdbc:postgresql://localhost:5432/trino
    username: trino
    password: trino
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

trino:
  jwt:
    secret: ${TRINO_JWT_SECRET:changeme-dev-secret-not-for-production-use-only-32bytes-min}
    access-expiration-minutes: 30
    refresh-expiration-days: 7
